<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var RELOAD_KEY = 'pandagarde_hub_native_sw_reload_v1';

        function isNativeShell() {
          try {
            var protocol = window.location.protocol;
            if (protocol === 'capacitor:' || protocol === 'ionic:') {
              return true;
            }
            var cap = window.Capacitor;
            return !!(cap && cap.isNativePlatform && cap.isNativePlatform());
          } catch (e) {
            return false;
          }
        }

        function clearWebCaches() {
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
            );
          }
          if (window.caches && caches.keys) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              })
            );
          }
          return Promise.all(tasks);
        }

        if (!isNativeShell()) {
          return;
        }

        // Stale SW may have served old index.html with missing JS chunks — reload once after purge.
        if (
          'serviceWorker' in navigator &&
          navigator.serviceWorker.controller &&
          !sessionStorage.getItem(RELOAD_KEY)
        ) {
          sessionStorage.setItem(RELOAD_KEY, '1');
          clearWebCaches().finally(function () {
            window.location.reload();
          });
          return;
        }

        sessionStorage.removeItem(RELOAD_KEY);
        clearWebCaches();
      })();
    </script>
    <link rel="icon" type="image/png" href="/LogoPandagarde.png" />
    <link rel="manifest" href="/familyhub-manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description" content="PandaGarde Family Hub — daily privacy missions and family progress. Local-first, no account required." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Family Hub" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/LogoPandagarde.png" />
    <title>PandaGarde Family Hub</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pandagarde-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.documentElement;
        var c = window.Capacitor;
        if (c && c.isNativePlatform && c.isNativePlatform()) {
          root.classList.add('capacitor', 'platform-' + c.getPlatform());
        }

        function applyEarlySafeAreas() {
          var probe = document.createElement('div');
          probe.style.cssText =
            'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;' +
            'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);';
          root.appendChild(probe);
          var style = getComputedStyle(probe);
          var top = parseFloat(style.paddingTop) || 0;
          var bottom = parseFloat(style.paddingBottom) || 0;
          probe.remove();

          if (c && c.getPlatform && c.getPlatform() === 'ios') {
            var longSide = Math.max(window.screen.height, window.screen.width);
            if (top < 1) {
              top = longSide >= 932 ? 54 : longSide >= 812 ? 47 : 20;
            }
            if (bottom < 1 && longSide >= 812) {
              bottom = 28;
            }
          }

          root.style.setProperty('--hub-safe-top', top + 'px');
          root.style.setProperty('--hub-nav-safe-bottom', bottom + 'px');
        }

        applyEarlySafeAreas();
      })();
    </script>
    <script type="module" src="/src/familyhub-main.tsx"></script>
  </body>
</html>
